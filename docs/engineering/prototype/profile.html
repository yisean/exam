<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人资料 · 云帆考试系统</title>
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <div class="proto-bar">
    <span class="pill">原型</span>
    <span>云帆考试系统 · 管理端</span>
    <a href="index.html">← 返回原型导航</a>
    <span class="muted" style="color:#8492a6">仅作演示，数据为示例</span>
  </div>

  <div class="app-wrapper">
    <aside class="sidebar">
      <div class="logo"><span class="logo-badge">云</span><span>云帆考试系统</span></div>
      <nav class="menu">
        <a class="menu-item" href="dashboard.html"><span class="ico">📊</span> 控制台</a>

        <div class="menu-group-title">在线考试</div>
        <a class="menu-item" href="my-exam.html"><span class="ico">📝</span> 在线考试</a>
        <a class="menu-item" href="my-records.html"><span class="ico">🏆</span> 我的成绩</a>

        <div class="menu-group-title">考试管理</div>
        <a class="menu-item" href="repo.html"><span class="ico">📚</span> 题库管理</a>
        <a class="menu-item" href="qu.html"><span class="ico">❓</span> 试题管理</a>
        <a class="menu-item" href="exam.html"><span class="ico">🗂️</span> 考试管理</a>

        <div class="menu-group-title">系统设置</div>
        <a class="menu-item" href="sys-config.html"><span class="ico">⚙️</span> 系统配置</a>
        <a class="menu-item" href="sys-depart.html"><span class="ico">🌳</span> 部门管理</a>
        <a class="menu-item" href="sys-role.html"><span class="ico">🔑</span> 角色管理</a>
        <a class="menu-item" href="sys-user.html"><span class="ico">👤</span> 用户管理</a>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="crumbs"><span>首页</span><span class="sep">/</span><span class="cur">个人资料</span></div>
        <a class="user" href="profile.html"><span class="avatar">超</span><span>超管A</span></a>
      </header>

      <main class="content">
        <div class="page-title">个人资料</div>
        <div class="page-desc">查看与维护您的账号信息及登录密码。</div>

        <div class="flex gap" style="align-items:flex-start;flex-wrap:wrap">
          <!-- 左：个人卡片 -->
          <div class="card" style="width:280px;flex-shrink:0">
            <div class="card-body" style="text-align:center">
              <div style="width:96px;height:96px;border-radius:50%;background:var(--color-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:38px;margin:8px auto 16px">超</div>
              <div style="font-size:18px;font-weight:600">超管A</div>
              <div style="margin-top:10px"><span class="tag tag-danger">超级管理员</span></div>
              <div class="muted" style="margin-top:12px">技术部</div>
              <div class="divider"></div>
              <a class="btn btn-plain" href="#" style="width:100%">📷 更换头像</a>
            </div>
          </div>

          <!-- 右：标签页 -->
          <div class="card" style="flex:1;min-width:420px">
            <div class="card-body">
              <div class="tabs">
                <div class="tab active" id="tabBasic" onclick="switchTab('basic')">基本资料</div>
                <div class="tab" id="tabPwd" onclick="switchTab('pwd')">修改密码</div>
              </div>

              <!-- 基本资料 -->
              <div id="paneBasic">
                <div class="form-item">
                  <label><span class="req">*</span>真实姓名</label>
                  <div class="control"><input class="input" value="超管A" /></div>
                </div>
                <div class="form-item">
                  <label>用户名</label>
                  <div class="control">
                    <input class="input" value="admin" readonly style="background:#f5f7fa;cursor:not-allowed" />
                    <div class="form-tip">用户名为登录账号，不可修改。</div>
                  </div>
                </div>
                <div class="form-item">
                  <label>所属部门</label>
                  <div class="control"><input class="input" value="技术部" readonly style="background:#f5f7fa;cursor:not-allowed" /></div>
                </div>
                <div class="form-item">
                  <label>邮箱</label>
                  <div class="control"><input class="input" value="admin@yunfan.com" /></div>
                </div>
                <div class="form-item">
                  <label></label>
                  <div class="control"><a class="btn btn-primary" href="#">保 存</a></div>
                </div>
              </div>

              <!-- 修改密码 -->
              <div id="panePwd" style="display:none">
                <div class="form-item">
                  <label><span class="req">*</span>原密码</label>
                  <div class="control"><input class="input" type="password" placeholder="请输入当前密码" /></div>
                </div>
                <div class="form-item">
                  <label><span class="req">*</span>新密码</label>
                  <div class="control">
                    <input class="input" type="password" placeholder="请输入新密码" />
                    <div class="form-tip">建议 8 位以上，包含字母与数字。</div>
                  </div>
                </div>
                <div class="form-item">
                  <label><span class="req">*</span>确认新密码</label>
                  <div class="control"><input class="input" type="password" placeholder="请再次输入新密码" /></div>
                </div>
                <div class="form-item">
                  <label></label>
                  <div class="control"><a class="btn btn-primary" href="#">保 存</a></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    function switchTab(name) {
      var isBasic = name === 'basic';
      document.getElementById('tabBasic').classList.toggle('active', isBasic);
      document.getElementById('tabPwd').classList.toggle('active', !isBasic);
      document.getElementById('paneBasic').style.display = isBasic ? '' : 'none';
      document.getElementById('panePwd').style.display = isBasic ? 'none' : '';
    }
  </script>
</body>
</html>
