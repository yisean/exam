<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>考试结果 · 云帆考试系统 · 学员端</title>
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <div class="proto-bar">
    <span class="pill">原型</span>
    <span>云帆考试系统 · 学员端</span>
    <a href="index.html">← 返回原型导航</a>
    <span class="muted" style="color:#8492a6">仅作演示，数据为示例</span>
  </div>

  <div style="min-height:calc(100vh - 30px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;">
    <div class="card" style="width:600px;max-width:100%;">
      <div class="card-body" style="text-align:center;padding:34px 30px;">
        <div class="muted" style="margin-bottom:6px;">2026 Q2 全员安全生产考核</div>
        <div style="font-size:15px;color:var(--text-regular);margin-bottom:18px;">您的本次成绩</div>

        <div style="font-size:64px;font-weight:800;line-height:1;color:var(--color-success);">82<span style="font-size:24px;font-weight:600;">分</span></div>
        <div style="margin-top:14px;">
          <span class="tag tag-success" style="height:30px;font-size:14px;padding:0 16px;">✓ 已通过（及格分 60）</span>
        </div>

        <div class="divider"></div>

        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px;text-align:left;">
          <div class="flex between" style="padding:8px 12px;background:#fafafa;border-radius:4px;">
            <span class="muted">客观题得分</span><b>72 / 80</b>
          </div>
          <div class="flex between" style="padding:8px 12px;background:#fafafa;border-radius:4px;">
            <span class="muted">主观题得分</span><b>10 / 20</b>
          </div>
          <div class="flex between" style="padding:8px 12px;background:#fafafa;border-radius:4px;">
            <span class="muted">答对题数</span><b>17 / 20</b>
          </div>
          <div class="flex between" style="padding:8px 12px;background:#fafafa;border-radius:4px;">
            <span class="muted">考试用时</span><b>22 分 18 秒</b>
          </div>
          <div class="flex between" style="padding:8px 12px;background:#fafafa;border-radius:4px;">
            <span class="muted">交卷时间</span><b>2026-05-29 15:42</b>
          </div>
          <div class="flex between" style="padding:8px 12px;background:#fafafa;border-radius:4px;">
            <span class="muted">考试排名</span><b>12 / 120</b>
          </div>
        </div>

        <div class="flex gap" style="justify-content:center;margin-top:26px;">
          <a class="btn" href="my-book.html">查看错题</a>
          <a class="btn btn-primary" href="my-exam.html">返回考试列表</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
