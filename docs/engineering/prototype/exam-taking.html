<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>在线答题 · 云帆考试系统 · 学员端</title>
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body style="background:var(--bg-page);">
  <div class="proto-bar">
    <span class="pill">原型</span>
    <span>云帆考试系统 · 学员端</span>
    <a href="index.html">← 返回原型导航</a>
    <span class="muted" style="color:#8492a6">仅作演示，数据为示例</span>
  </div>

  <!-- 顶部考试条 -->
  <header class="topbar" style="padding:0 24px;height:56px;">
    <div style="font-size:16px;font-weight:600;">2026 Q2 全员安全生产考核</div>
    <div class="flex items-center gap">
      <span class="muted">剩余时间</span>
      <span id="timer" class="tag tag-danger" style="height:32px;font-size:18px;font-weight:700;padding:0 14px;font-variant-numeric:tabular-nums;">24:35</span>
      <a class="btn btn-danger" href="javascript:void(0)" onclick="openSubmit()">交卷</a>
    </div>
  </header>

  <!-- 答题主体 -->
  <div style="display:flex;gap:18px;padding:18px 24px;align-items:flex-start;">

    <!-- 左侧题目区 -->
    <div class="card" style="flex:1;">
      <div class="card-body">

        <!-- 单选题 -->
        <div class="qu-block" style="padding-top:0;border-top:none;">
          <div class="flex gap items-center" style="margin-bottom:6px;">
            <span class="tag tag-primary">单选题</span>
            <span class="muted">每题 5 分</span>
          </div>
          <div class="qu-stem"><span class="qu-no">1.</span>我国最北面的城市是哪个？</div>
          <div class="qu-option" onclick="pickSingle(this)"><span class="opt-key">A</span><span>铁岭</span></div>
          <div class="qu-option" onclick="pickSingle(this)"><span class="opt-key">B</span><span>齐齐哈尔</span></div>
          <div class="qu-option" onclick="pickSingle(this)"><span class="opt-key">C</span><span>沈阳</span></div>
          <div class="qu-option" onclick="pickSingle(this)"><span class="opt-key">D</span><span>漠河</span></div>
        </div>

        <!-- 多选题 -->
        <div class="qu-block" style="border-bottom:none;">
          <div class="flex gap items-center" style="margin-bottom:6px;">
            <span class="tag tag-warning">多选题</span>
            <span class="muted">每题 5 分，少选不得分</span>
          </div>
          <div class="qu-stem"><span class="qu-no">2.</span>以下哪些属于中国的特别行政区？（多选）</div>
          <div class="qu-option" onclick="pickMulti(this)"><span class="opt-key">A</span><span>香港</span></div>
          <div class="qu-option" onclick="pickMulti(this)"><span class="opt-key">B</span><span>澳门</span></div>
          <div class="qu-option" onclick="pickMulti(this)"><span class="opt-key">C</span><span>珠海</span></div>
          <div class="qu-option" onclick="pickMulti(this)"><span class="opt-key">D</span><span>重庆</span></div>
        </div>

        <div class="divider"></div>
        <div class="flex between items-center">
          <a class="btn" href="javascript:void(0)">← 上一题</a>
          <span class="muted">第 1 ~ 2 题 / 共 20 题</span>
          <a class="btn btn-primary" href="javascript:void(0)">下一题 →</a>
        </div>
      </div>
    </div>

    <!-- 右侧答题卡 -->
    <div class="card" style="width:300px;flex-shrink:0;">
      <div class="card-header" style="font-size:15px;">答题卡</div>
      <div class="card-body">
        <div class="qu-card-grid" id="cardGrid"></div>

        <div class="divider"></div>
        <div class="flex gap" style="flex-wrap:wrap;font-size:12px;color:var(--text-regular);">
          <span class="flex items-center" style="gap:6px;"><span class="q" style="width:18px;height:18px;background:var(--color-primary);border-color:var(--color-primary);"></span> 已答</span>
          <span class="flex items-center" style="gap:6px;"><span class="q" style="width:18px;height:18px;"></span> 未答</span>
          <span class="flex items-center" style="gap:6px;"><span class="q" style="width:18px;height:18px;box-shadow:0 0 0 2px var(--color-primary-light);"></span> 当前</span>
        </div>

        <a class="btn btn-danger mt" href="javascript:void(0)" onclick="openSubmit()" style="width:100%;">交卷</a>
      </div>
    </div>
  </div>

  <!-- 交卷确认对话框 -->
  <div class="dialog-mask" id="submitDlg">
    <div class="dialog">
      <div class="dialog-header">确认交卷</div>
      <div class="dialog-body">
        <p>您当前已作答 <b id="ansCount">2</b> / 20 题，仍有部分题目未作答。</p>
        <p class="muted" style="margin-top:8px;">交卷后将无法继续修改答案，是否确认交卷？</p>
      </div>
      <div class="dialog-footer">
        <a class="btn" href="javascript:void(0)" onclick="closeSubmit()">继续答题</a>
        <a class="btn btn-danger" href="exam-result.html">确认交卷</a>
      </div>
    </div>
  </div>

  <script>
    // 答题卡 1~20
    var grid = document.getElementById('cardGrid');
    for (var i = 1; i <= 20; i++) {
      var d = document.createElement('div');
      d.className = 'q';
      d.textContent = i;
      if (i === 1 || i === 2) d.classList.add('answered'); // 示例已答
      if (i === 1) d.classList.add('current');             // 当前题
      grid.appendChild(d);
    }

    // 单选：组内互斥
    function pickSingle(el) {
      var sibs = el.parentNode.querySelectorAll('.qu-option');
      sibs.forEach(function (s) { s.classList.remove('selected'); });
      el.classList.add('selected');
    }
    // 多选：切换
    function pickMulti(el) { el.classList.toggle('selected'); }

    // 交卷对话框
    function openSubmit() {
      var answered = document.querySelectorAll('#cardGrid .q.answered').length;
      document.getElementById('ansCount').textContent = answered;
      document.getElementById('submitDlg').classList.add('open');
    }
    function closeSubmit() { document.getElementById('submitDlg').classList.remove('open'); }

    // 倒计时（演示用，从 24:35 开始递减）
    var remain = 24 * 60 + 35;
    var timerEl = document.getElementById('timer');
    setInterval(function () {
      if (remain <= 0) { timerEl.textContent = '00:00'; return; }
      remain--;
      var m = String(Math.floor(remain / 60)).padStart(2, '0');
      var s = String(remain % 60).padStart(2, '0');
      timerEl.textContent = m + ':' + s;
    }, 1000);
  </script>
</body>
</html>
